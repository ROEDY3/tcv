apply plugin: 'com.android.application'

android {
    namespace "com.tcv"
    compileSdk 35

    defaultConfig {
        applicationId "com.tcv"
        // 29+ (Android 10): MediaStore RELATIVE_PATH tersedia,
        // tidak perlu izin storage warisan sama sekali.
        minSdk 29
        // 34: standar Android 14+ (tipe foreground service camera|microphone).
        targetSdk 34
        versionCode 3
        versionName "0.2.0"
    }

    signingConfigs {
        // Keystore tetap milik proyek (test key, aman di-commit seperti
        // pola testkey upstream): semua build CI satu tanda tangan
        // sehingga update APK mulus tanpa uninstall.
        debug {
            storeFile file('tcv-debug.jks')
            storePassword 'tcvdebug12'
            keyAlias 'tcv'
            keyPassword 'tcvdebug12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Sengaja tanpa dependencies eksternal: semua pakai framework Android saja.
dependencies {
}
